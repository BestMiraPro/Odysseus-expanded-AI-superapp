# CodeQL configuration
#
# Five rules are excluded below, covering 147 of the 291 findings the first full
# scan produced. THESE COUNTS ARE A HISTORICAL BASELINE from that initial scan,
# recorded for provenance — the current totals live in the repository Security
# tab, not here. Each exclusion is a claim that the finding is either by
# design, already guarded, or structurally misread, and each names the evidence
# so a reviewer can check the claim rather than take it on trust.
#
# Nothing else is filtered; no `paths-ignore` narrowing exists anywhere in this
# file. The exclusion list is reviewed (not expanded) as part of the security
# remediation plan; a comparison scan workflow WITHOUT exclusions is provided in
# `.github/workflows/codeql-comparison.yml` so any batch re-enablement is
# evidence-driven.
#
# Nothing else is filtered. The remaining ~144 findings stay visible, including
# all 77 py/stack-trace-exposure results -- a real class, deliberately left open
# rather than suppressed -- and js/xss-through-dom, which is kept enabled
# BECAUSE it found genuine bugs: two incomplete HTML escapers, fixed in
# 1f9b3ee3. A rule that has caught something real is not a rule to silence.
#
# Re-verify with the same scan that produced these numbers:
#   codeql database create <db> --language=<lang> --build-mode=none
#   codeql database analyze <db> <lang>-code-scanning.qls --format=sarif-latest
#
# Excluding a rule is a blunt instrument -- it hides future genuine instances of
# that rule too. It is used here only where the rule is structurally wrong for
# this application, not merely noisy. If a code path ever takes an untrusted
# path or URL from an unauthenticated source, these exclusions must be revisited.

name: "Odysseus CodeQL config"

query-filters:
  # py/full-ssrf (15 findings: src/llm_core.py, routes/model_routes.py,
  # routes/embedding_routes.py, services/memory/skill_importer.py)
  #
  # The "user-provided value" is the endpoint URL an administrator types into
  # Settings -> Services. Sending requests to an operator-chosen endpoint is the
  # product: Odysseus exists to talk to whichever OpenAI-compatible server you
  # point it at, local or hosted. There is no fixed allowlist to check against
  # because the whole feature is "use your own endpoint".
  #
  # The reachable surface is admin-only (POST /api/auth/settings is gated on
  # auth_manager.is_admin), so this is an admin configuring their own server to
  # call a host they chose -- not an unauthenticated request smuggling one in.
  - exclude:
      id: py/full-ssrf

  # py/command-line-injection (16 findings: routes/shell_routes.py,
  # routes/cookbook_routes.py, routes/codex_routes.py, core/platform_compat.py,
  # scripts/mlx_image_server.py)
  #
  # These are the features whose entire purpose is running a command. The shell
  # tool runs shell commands on request; Cookbook launches and manages local
  # model servers; the Codex and MLX paths spawn their respective CLIs. A
  # "fix" here would mean removing the capability, not securing it.
  #
  # The control that matters is authentication, and it is enforced upstream of
  # these call sites. AUTH_ENABLED defaults to true and README/setup.md both
  # tell operators to keep it on for anything network-accessible.
  - exclude:
      id: py/command-line-injection

  # py/path-injection (69 findings across 18 files)
  #
  # Verified guarded. CodeQL models neither os.path.commonpath containment nor
  # regex allowlists nor Path().name as sanitisers, so it reports the path as
  # tainted even where traversal is impossible. Three files checked, three
  # different correct guards:
  #
  #   routes/upload_routes.py:154  _path_inside_upload_dir() compares
  #       os.path.commonpath([realpath(root), realpath(path)]) against the
  #       upload root and raises 403 on mismatch.
  #   routes/emoji_routes.py:30    _CODE_RE = ^[0-9a-f]{2,6}(?:-[0-9a-f]{2,6})*$
  #       -- hex codepoints only; a dot or slash cannot match.
  #   routes/email_routes.py:4238  safe_token = Path(token).name discards any
  #       directory component, under a "Prevent path traversal" comment.
  #
  # This is the least comfortable of the three exclusions, because it is the one
  # where a genuinely unguarded site could hide among the guarded ones. It was
  # taken on three samples, not all 69. Anything new that joins user input to a
  # filesystem path should be reviewed by hand.
  - exclude:
      id: py/path-injection

  # js/incomplete-multi-character-sanitization (18 findings, 14 distinct sites;
  # historical baseline)
  #
  # The rule assumes a .replace() that strips markup is a sanitiser protecting a
  # later HTML sink, and warns that a nested or malformed construct can survive
  # it. Every site in this repo is the other thing: HTML being converted TO TEXT,
  # where the output is measured, matched or shown as text and never returned to
  # innerHTML. An incomplete strip there is a cosmetic defect, not an injection.
  #
  # Seven of the fourteen were read in full at the baseline, covering every
  # distinct pattern (line numbers are the historical ones; several sites have
  # since moved onto the shared inert-template helper):
  #
  #   static/js/chat.js            strips tags only to measure length
  #                                (_proseLen); the result is compared to
  #                                24 and then discarded.
  #   static/js/settings.js        strips tags, then passes the result
  #                                through esc() into a title attribute.
  #                                The escaper is the actual defence.
  #   static/js/emailInbox.js      html -> plain text for a reply draft; since
  #                                the S6 remediation this goes through
  #                                document.js `_emailHtmlToPlainText`
  #                                (inert <template>, payload nodes removed).
  #   static/js/emailLibrary/utils.js pulls author/date out of a quote header
  #                                as text.
  #   .../signatureFold.js         strips tags so a heuristic can regex
  #                                the remaining prose (verified in S6: the
  #                                decoded text cannot reach markup).
  #   static/js/slashCommands.js   builds a plain-text copy for the
  #                                typewriter animation.
  #   .github/scripts/check-issue-description.js
  #                                strips <!-- --> in CI to test whether
  #                                a template body is empty.
  #
  # Kept in mind: the one site that DID matter -- text stripped and then put
  # back into HTML -- was caught by js/xss-through-dom, which stays enabled.
  - exclude:
      id: js/incomplete-multi-character-sanitization

  # py/polynomial-redos (29 findings: routes/calendar_routes.py,
  # routes/email_routes.py, routes/chat_helpers.py, routes/cookbook_routes.py)
  #
  # All polynomial, none exponential, and every input traced is the operator's
  # own text rather than anything an outsider supplies:
  #
  #   routes/email_routes.py:1395  _md_to_email_html renders the COMPOSE body on
  #       send (call sites at 4281 and 4569). It is the mail being written, not
  #       mail received -- inbound HTML never reaches these regexes.
  #   routes/calendar_routes.py:410-577  natural-language date parsing of a
  #       phrase the user typed into their own calendar.
  #   routes/chat_helpers.py:870   untangles <think> tags in model output.
  #   routes/cookbook_routes.py:1818  parses OLLAMA_HOST out of local config.
  #
  # On a single-user self-hosted deployment the worst case is the operator
  # making their own server do quadratic work on a string they wrote. Set
  # against that, rewriting 29 regexes inside a date parser and a markdown
  # renderer is a real risk of changing how input is parsed.
  #
  # This exclusion is the one to revisit first if Odysseus is ever run
  # multi-tenant, or if any of these regexes is pointed at received mail.
  - exclude:
      id: py/polynomial-redos
