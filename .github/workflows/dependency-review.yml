# Supply-chain review
#
# Purpose: defend against "side-chain" / supply-chain attacks -- a pull request
# that adds (or bumps) a dependency to a version with a known vulnerability or a
# disallowed license. Two layers:
#
#   - dependency-review: runs ONLY on pull requests. It compares the
#     dependencies before and after the PR and blocks the merge if the change
#     pulls in a package with a known security advisory. This is the gate.
#   - pip-audit: scans the project's current Python requirements against the
#     advisory database. Advisory only (it never blocks a merge), because it can
#     flag a pre-existing issue in an already-shipped dependency.

name: Dependency review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Default-deny token; jobs grant only read access.
permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    # Only meaningful on a pull request -- it needs a base..head diff to review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Fail the PR on any newly introduced moderate-or-worse advisory.
          fail-on-severity: moderate

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: report known-vulnerable Python deps without blocking the merge.
    # NOTE: findings appear in the job LOG OUTPUT, not the Security tab — and a
    # "green" result here only means the workflow step completed
    # (continue-on-error masks non-zero pip-audit exits). Read the job logs:
    # a clean audit is `pip-audit` reporting no advisories, not a green tick.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # The SHIPPED runtime: CPython 3.14 matches the Docker image build
          # (python:3.14-slim) and CI's LOCK_TARGET_PYTHON. Auditing 3.12 with
          # loose requirements compared a different resolution than Docker
          # installs — which told operators nothing about the shipped image.
          python-version: '3.14'

      - name: Run pip-audit on the shipped locked requirements
        run: |
          set -euo pipefail
          pip install pip-audit==2.10.0
          pip-audit -r requirements.lock.txt --strict

      - name: Run pip-audit on optional extras (separately labeled)
        run: |
          pip-audit -r requirements.txt -r requirements-optional.txt --strict ||
            echo "::warning::pip-audit found advisories in the OPTIONAL extras — these are not part of the shipped-image claim above."
