name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# The runtime requirements.lock.txt is generated for
# (scripts/lock_requirements.sh). Only that lane may install the lock.
env:
  LOCK_TARGET_PYTHON: "3.14"

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-test-guidance:
    name: Focused test guidance (report-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report changed test paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report_file="$RUNNER_TEMP/focused-test-guidance.md"
          publish_report() {
            cat "$report_file"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              cat "$report_file" >> "$GITHUB_STEP_SUMMARY" || true
            fi
            return 0
          }

          report_unavailable() {
            {
              printf '%s\n\n' '## Focused test guidance unavailable (report-only)'
              printf '%s\n\n' "$1"
              printf '%s\n' 'Existing blocking CI remains the source of truth.'
            } > "$report_file"
            publish_report
            exit 0
          }

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            report_unavailable "Pull request base/head metadata is missing."
          fi

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request base commit is unavailable locally."
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            report_unavailable "The pull request head commit is unavailable locally."
          fi

          if ! python3 .github/scripts/focused_test_guidance.py \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" > "$report_file"; then
            report_unavailable "The focused test guidance helper could not produce a report."
          fi

          publish_report

  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      - name: node --check
        run: |
          shopt -s globstar nullglob
          for f in static/app.js static/js/**/*.js; do
            node --check "$f"
          done

  python-tests:
    name: Python tests (Linux, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Make Python test validation authoritative for the configured scope.
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor the project still supports; 3.14 is what the
        # Dockerfile actually ships, and was previously untested in CI.
        python-version: ["3.11", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this PR only touches repository prose outside the Pages site.
      # If so, skip the expensive pytest run while still reporting a passing check.
      - name: Check for docs-only changes
        id: docs-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Keep website/ and assets/branding/ out of this bypass: pytest owns
          # regression guards for their published-file and orphan-asset contracts.
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          non_docs=$(echo "$changed" | grep -Ev '^(docs/|[^/]+\.md$|\.github/[^/]+\.md$)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected — skipping pytest."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # A lock is a resolution for one runtime. requirements.lock.txt targets
      # the runtime the Docker image ships (linux/amd64, CPython 3.14) and does
      # not install on 3.11 at all — numpy 2.5.3 publishes no 3.11 wheel. So
      # the shipped-runtime lane installs the lock, and the older-Python
      # compatibility lane installs the loose file, which is exactly what that
      # lane exists to check.
      - name: Install dependencies
        if: steps.docs-check.outputs.docs_only != 'true'
        run: |
          if [ "${{ matrix.python-version }}" = "${{ env.LOCK_TARGET_PYTHON }}" ]; then
            pip install -r requirements.lock.txt -r requirements-dev.txt
          else
            pip install -r requirements.txt -r requirements-dev.txt
          fi
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      - name: Run tests
        if: steps.docs-check.outputs.docs_only != 'true'
        run: |
          set -o pipefail
          python -m pytest -q -rf | tee pytest-output.txt
        env:
          # Exercises the dialect-aware schema reconciliation against a real
          # server; without this the PostgreSQL parity cases skip.
          TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/postgres
      # See the windows-tests lane: annotations are readable without repository
      # access, so the failing test ids belong there and not only in the log.
      - name: Surface failing tests as annotations
        if: failure() && steps.docs-check.outputs.docs_only != 'true'
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  windows-tests:
    name: Python tests (Windows, py3.14)
    runs-on: windows-latest
    # The project supports Windows and its shell discovery, process
    # completion, and path handling differ materially from Linux — the
    # September 5 review found real Windows-only defects (Git Bash vs the WSL
    # stub, native temp roots, PYTEST_CURRENT_TEST length limits) that a
    # Linux-only CI could not have caught.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # The lock is resolved for linux/amd64, so Windows installs the loose
      # runtime requirements. Keeping the lane green is what tells us the
      # unpinned set still resolves on the other supported platform.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Install ripgrep
        run: choco install ripgrep -y --no-progress
      - run: mkdir data
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rf | tee pytest-output.txt
      # Reading a job's log needs access to the repository; check annotations
      # are public. Without this a failure on this lane reports only "Process
      # completed with exit code 1" — enough to know it is red, not enough to
      # know why, which is exactly the position a contributor looking at a
      # failed run on their own fork is in.
      - name: Surface failing tests as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do
            echo "::error::${line}"
          done

  lock-installs-on-runtime:
    name: Lock installs on the shipped runtime
    runs-on: ubuntu-latest
    # The image installs requirements.lock.txt; building here is what proves
    # the committed lock still resolves on the runtime it was generated for.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the lock on the shipped runtime and import it
        run: |
          # A real install, not --dry-run: resolution says nothing about
          # native builds, wheels unpacking, or the modules importing. gcc is
          # present because some pins build from source. Verified locally
          # against python:3.14-slim before this job was written.
          docker run --rm -i --platform linux/amd64 python:3.14-slim sh -c '
            set -e
            cat > /tmp/lock.txt
            apt-get update -qq >/dev/null 2>&1 || true
            apt-get install -y -qq --no-install-recommends gcc >/dev/null 2>&1 || true
            pip install --no-cache-dir -q -r /tmp/lock.txt
            python -c "
          import importlib
          for m in (\"fastapi\", \"uvicorn\", \"sqlalchemy\", \"pydantic\", \"httpx\",
                    \"bcrypt\", \"mcp\", \"psycopg2\", \"cryptography\", \"numpy\",
                    \"nh3\", \"icalendar\", \"caldav\", \"croniter\", \"pyotp\",
                    \"qrcode\", \"markdown\", \"pypdf\"):
              importlib.import_module(m)
          print(\"lock installs and imports on the shipped runtime\")
          "
          ' < requirements.lock.txt

  lock-freshness:
    name: Dependency lock is current
    runs-on: ubuntu-latest
    # A lock nobody regenerates is worse than none: it silently diverges from
    # requirements.txt. This fails when a runtime dependency was added or
    # removed without re-running scripts/lock_requirements.sh.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      # The checker parses PEP 508 requirements and evaluates their environment
      # markers, so it needs `packaging`. A setup-python runner ships neither it
      # nor anything that re-exports it, so without this the job died on the
      # import — never once reaching the check it exists to run.
      - name: Install the checker's own dependency
        run: python -m pip install --disable-pip-version-check "packaging>=24"
      - name: Every runtime requirement appears in the lock
        run: python .github/scripts/check_lock_covers_requirements.py
